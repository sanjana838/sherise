<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SheRise ChatGPT Style</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .chat-container {
      width: 600px;
      max-width: 95%;
      height: 90vh;
      background-color: #ffffff;
      border-radius: 15px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      overflow: hidden;
    }

    .chat-header {
      background-color: #ff69b4;
      color: #fff;
      padding: 20px;
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
    }

    .chat-box {
      flex: 1;
      padding: 15px;
      background-color: #f9f9f9;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-message {
      padding: 12px 18px;
      border-radius: 20px;
      max-width: 75%;
      word-wrap: break-word;
      font-size: 1rem;
      line-height: 1.4;
      position: relative;
      animation: fadeIn 0.3s ease;
      white-space: pre-wrap; /* preserve line breaks */
    }

    .user-msg {
      background-color: #ffebf4;
      align-self: flex-end;
      border-bottom-right-radius: 0;
    }

    .bot-msg {
      background-color: #e5e5e5;
      align-self: flex-start;
      border-bottom-left-radius: 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .typing {
      font-style: italic;
      opacity: 0.6;
    }

    .chat-input {
      display: flex;
      padding: 15px;
      border-top: 1px solid #ddd;
      background-color: #fff;
    }

    .chat-input input {
      flex: 1;
      padding: 12px 18px;
      border-radius: 25px;
      border: 1px solid #ccc;
      outline: none;
      font-size: 1rem;
    }

    .chat-input button {
      margin-left: 12px;
      padding: 12px 20px;
      border: none;
      border-radius: 25px;
      background-color: #ff69b4;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .chat-input button:hover {
      background-color: #ff85c1;
    }

    .chat-box::-webkit-scrollbar {
      width: 6px;
    }

    .chat-box::-webkit-scrollbar-thumb {
      background-color: rgba(0,0,0,0.2);
      border-radius: 3px;
    }

    @media (max-width: 650px) {
      .chat-container {
        width: 95%;
        height: 95vh;
      }
    }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">🌸 SheRise Chat</div>
  <div class="chat-box" id="chatBox"></div>
  <form class="chat-input" id="chatForm">
    <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off" required>
    <button type="submit">Send</button>
  </form>
</div>

<script>
const chatBox = document.getElementById('chatBox');
const chatForm = document.getElementById('chatForm');
const messageInput = document.getElementById('messageInput');

chatForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const userMessage = messageInput.value.trim();
  if (!userMessage) return;

  appendMessage(userMessage, 'user-msg');
  messageInput.value = '';

  // Show typing indicator
  const typingBubble = appendMessage('Typing...', 'bot-msg', true);

  try {
    const response = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: userMessage })
    });

    const data = await response.json();

    // Remove typing indicator
    typingBubble.remove();

    // Format reply as pointwise if contains multiple items
    const formattedReply = formatPointwise(data.reply);
    appendMessage(formattedReply, 'bot-msg');

  } catch (err) {
    typingBubble.remove();
    appendMessage('⚠️ Something went wrong', 'bot-msg');
  }
});

// Append message function
function appendMessage(message, className, isTyping=false) {
  const msgDiv = document.createElement('div');
  msgDiv.className = `chat-message ${className}`;
  if (isTyping) msgDiv.classList.add('typing');
  msgDiv.innerHTML = message;
  chatBox.appendChild(msgDiv);
  chatBox.scrollTop = chatBox.scrollHeight;
  return msgDiv;
}

// Convert text to pointwise format
function formatPointwise(text) {
  const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
  if (lines.length <= 1) return text; // single line, return as is
  let html = '';
  lines.forEach((line, index) => {
    html += `${index + 1}. ${line.trim()}<br>`;
  });
  return html;
}
</script>

</body>
</html>
